    <main>
      <section class="contact-section container">
        <div class="contact-container dotted-border">
          <div class="contact-text--box">
            <p class="hello-text">Hello</p>
            <p class="enquiry-text">Have a question or business inquiry?</p>
            <p class="contact-text">
              You can get in touch with us using the links below.
            </p>
            <a href="#" class="email-btn"
              ><p>Email Us</p>
              <p>
                <ion-icon
                  name="arrow-forward-outline"
                  class="arrow"
                ></ion-icon></p
            ></a>
          </div>

          <form id="form" class="form" method="POST" action="contact.php">
            <div class="form-input">
              <div>
                <label class="label-name">Full Name</label>
                <input
                  class="input-name"
                  type="text"
                  name="fullname"
                  placeholder="Jane Doe"
                  required
                />
              </div>

              <div>
                <label class="label-name">Your Email</label>
                <input
                  class="input-name"
                  type="email"
                  name="email"
                  placeholder="janedoe@example.com"
                  required
                />
              </div>
            </div>

            <label class="label-name">Your Message</label>
            <textarea
              class="message-area"
              name="Message"
              placeholder="Hello, I need help for.."
            ></textarea>

            <input type="text" name="website" style="display: none" />

            <button type="submit" class="submit-btn">Send Message</button>
          </form>

          <div id="form-message"></div>
        </div>
      </section>
    </main>
